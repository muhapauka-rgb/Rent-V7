services:
  db:
    image: postgres:15
    container_name: rent_db
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "5433:5432"
    volumes:
      - rent_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: ${DB_HEALTHCHECK_INTERVAL:-30s}
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ocr-service:
    build: ./ocr-service
    container_name: rent_ocr
    env_file: .env
    environment:
      OCR_RUNTIME_MODE: ${OCR_RUNTIME_MODE:-auto}
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: ${OCR_HEALTHCHECK_INTERVAL:-60s}
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  api:
    build: ./api
    container_name: rent_api
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
      # ВАЖНО: внутри docker-сети ходим по имени сервиса
      OCR_URL: http://ocr-service:8000/recognize
      RENT_ACTIVITY_FILE: /runtime/last_activity
      RENT_ACTIVITY_TOUCH: ${RENT_ACTIVITY_TOUCH:-1}
    volumes:
      - ./.runtime:/runtime
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: ${API_HEALTHCHECK_INTERVAL:-60s}
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  telegram-bot:
    build: ./telegram-bot
    container_name: rent_bot
    env_file: .env
    environment:
      RENT_ACTIVITY_FILE: /runtime/last_activity
      RENT_ACTIVITY_TOUCH: ${RENT_ACTIVITY_TOUCH:-1}
    volumes:
      - ./.runtime:/runtime
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    container_name: rent_web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rent_pg: {}
